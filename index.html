<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

<meta name="viewport"
     content="width=device-width, initial-scale=1.0">

  <title>ETTC/BZA MESS QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    .header {
      background: #1f4e78;
      color: white;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 18px;
    }

    .header h2 {
      margin: 0;
      font-size: 22px;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 14px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
    }

    #reader {
      width: 100%;
    }

    .status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      display: none;
    }

    .success {
      display: block;
      background: #d9f2df;
      color: #176b2c;
      border: 1px solid #8bc99a;
    }

    .error {
      display: block;
      background: #f8dddd;
      color: #a32121;
      border: 1px solid #df9999;
    }

    .token-box {
      margin-top: 15px;
      display: none;
    }

    .token-label {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .token {
      background: #f1f3f5;
      padding: 12px;
      border-radius: 8px;
      word-break: break-all;
      font-family: monospace;
      font-size: 13px;
    }

    .button {
      width: 100%;
      margin-top: 15px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #1f4e78;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .instruction {
      text-align: center;
      margin-top: 15px;
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }

  </style>

</head>

<body>

<div class="container">

  <div class="header">

```
<h2>ETTC/BZA MESS</h2>

<p>QR Meal Scanner</p>
```

  </div>

  <div class="card">

```
<div id="reader"></div>


<div id="scanStatus"
     class="status">
</div>


<div id="tokenBox"
     class="token-box">

  <div class="token-label">
    Scanned QR Token
  </div>

  <div id="token"
       class="token">
  </div>

</div>


<button class="button"
        onclick="restartScanner()">

  SCAN NEXT QR

</button>


<div class="instruction">

  Ask the employee to show their QR code
  inside the scanning area.

</div>
```

  </div>

</div>

<script>

  let scanner = null;

  let scannerRunning = false;

  let lastScannedToken = "";


  function showStatus(message, type) {

    const status =
      document.getElementById("scanStatus");

    status.textContent = message;

    status.className =
      "status " + type;

  }


  function showToken(token) {

    document.getElementById("token").textContent =
      token;

    document.getElementById("tokenBox").style.display =
      "block";

  }


  function clearResult() {

    document.getElementById("scanStatus").textContent =
      "";

    document.getElementById("scanStatus").className =
      "status";

    document.getElementById("token").textContent =
      "";

    document.getElementById("tokenBox").style.display =
      "none";

  }


  function onScanSuccess(decodedText, decodedResult) {

    if (!decodedText) {
      return;
    }


    if (decodedText === lastScannedToken) {
      return;
    }


    lastScannedToken = decodedText;


    showToken(decodedText);


    showStatus(
      "QR SCANNED SUCCESSFULLY",
      "success"
    );


    stopScanner();

  }


  function onScanFailure(error) {

    // Normal scanning failures are ignored.

  }


  function startScanner() {

    clearResult();

    lastScannedToken = "";


    if (scannerRunning) {
      return;
    }


    scanner =
      new Html5Qrcode("reader");


    const config = {

      fps: 10,

      qrbox: function(viewfinderWidth,
                      viewfinderHeight) {

        const minEdge =
          Math.min(
            viewfinderWidth,
            viewfinderHeight
          );

        const size =
          Math.floor(minEdge * 0.70);


        return {
          width: size,
          height: size
        };

      },

      aspectRatio: 1.0

    };


    scanner.start(

      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    )
    .then(function() {

      scannerRunning = true;

    })
    .catch(function(error) {

      scannerRunning = false;

      showStatus(
        "Unable to open camera. Please allow camera permission.",
        "error"
      );

    });

  }


  function stopScanner() {

    if (!scanner || !scannerRunning) {
      return;
    }


    scanner.stop()
      .then(function() {

        scannerRunning = false;

      })
      .catch(function(error) {

        scannerRunning = false;

      });

  }


  function restartScanner() {

    stopScanner();

    clearResult();

    lastScannedToken = "";


    setTimeout(function() {

      startScanner();

    }, 500);

  }


  window.onload = function() {

    startScanner();

  };

</script>

</body>

</html>
