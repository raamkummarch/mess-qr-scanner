<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

<meta name="viewport"
     content="width=device-width, initial-scale=1.0">

  <title>ETTC/BZA MESS QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    .header {
      background: #1f4e78;
      color: white;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 18px;
    }

    .header h2 {
      margin: 0;
      font-size: 22px;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 14px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
    }

    #reader {
      width: 100%;
    }

    .status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      display: none;
    }

    .success {
      display: block;
      background: #d9f2df;
      color: #176b2c;
      border: 1px solid #8bc99a;
    }

    .error {
      display: block;
      background: #f8dddd;
      color: #a32121;
      border: 1px solid #df9999;
    }

    .info {
      display: block;
      background: #e7f0fa;
      color: #1f4e78;
      border: 1px solid #a8c4df;
    }

    .details {
      margin-top: 15px;
      display: none;
    }

    .detail-row {
      padding: 9px 0;
      border-bottom: 1px solid #eeeeee;
    }

    .detail-label {
      font-weight: bold;
      display: inline-block;
      width: 120px;
    }

    .button {
      width: 100%;
      margin-top: 15px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #1f4e78;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .instruction {
      text-align: center;
      margin-top: 15px;
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }

  </style>

</head>

<body>

<div class="container">

  <div class="header">


<h2>ETTC/BZA MESS</h2>

<p>QR Meal Scanner</p>


  </div>

  <div class="card">


<div id="reader"></div>


<div id="scanStatus"
     class="status">
</div>


<div id="details"
     class="details">

  <div class="detail-row">
    <span class="detail-label">Employee:</span>
    <span id="employeeName"></span>
  </div>

  <div class="detail-row">
    <span class="detail-label">Employee ID:</span>
    <span id="employeeId"></span>
  </div>

  <div class="detail-row">
    <span class="detail-label">Designation:</span>
    <span id="designation"></span>
  </div>

  <div class="detail-row">
    <span class="detail-label">Batch:</span>
    <span id="batchNo"></span>
  </div>

  <div class="detail-row">
    <span class="detail-label">Training:</span>
    <span id="fromDate"></span>
    &nbsp;to&nbsp;
    <span id="toDate"></span>
  </div>

  <div class="detail-row">
    <span class="detail-label">Accommodation:</span>
    <span id="accommodation"></span>
  </div>

</div>


<button class="button"
        onclick="restartScanner()">

  SCAN NEXT QR

</button>


<div class="instruction">

  Ask the employee to show their QR code
  inside the scanning area.

</div>


  </div>

</div>

<script>

  // -----------------------------------------
  // YOUR APPS SCRIPT WEB APP URL
  // -----------------------------------------

  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbxp85fHug-4WwNu1njVLaKj0UzR8556mnR7F1y18j_KbCZ2SxeeH6yJ_bd6kj6EfVLubw/exec";


  let scanner = null;

  let scannerRunning = false;

  let lastScannedToken = "";


  // -----------------------------------------
  // STATUS
  // -----------------------------------------

  function showStatus(message, type) {

    const status =
      document.getElementById("scanStatus");

    status.textContent =
      message;

    status.className =
      "status " + type;

  }


  // -----------------------------------------
  // CLEAR RESULT
  // -----------------------------------------

  function clearResult() {

    document.getElementById("scanStatus").textContent =
      "";

    document.getElementById("scanStatus").className =
      "status";


    document.getElementById("details").style.display =
      "none";

  }


  // -----------------------------------------
  // DISPLAY TRAINING DETAILS
  // -----------------------------------------

  function showTrainingDetails(result) {

    document.getElementById("employeeName").textContent =
      result.employeeName || "";

    document.getElementById("employeeId").textContent =
      result.employeeId || "";

    document.getElementById("designation").textContent =
      result.designation || "";

    document.getElementById("batchNo").textContent =
      result.batchNo || "";

    document.getElementById("fromDate").textContent =
      result.fromDate || "";

    document.getElementById("toDate").textContent =
      result.toDate || "";

    document.getElementById("accommodation").textContent =
      result.accommodation
        ? result.accommodation +
          (
            result.hostelRoom
              ? " - " + result.hostelRoom
              : ""
          )
        : "";

    document.getElementById("details").style.display =
      "block";

  }


  // -----------------------------------------
  // GLOBAL JSONP CALLBACK
  // -----------------------------------------

  window.qrValidationCallback =
    function(result) {

      if (!result) {

        showStatus(
          "No response received from server.",
          "error"
        );

        return;

      }


      if (!result.success) {

        showStatus(
          result.message ||
          "QR validation failed.",
          "error"
        );

        return;

      }


      showTrainingDetails(result);
      
      showStatus(
        "MEAL TIME VALID - " + result.meal,
        "success"
      );

    };


  // -----------------------------------------
  // SEND TOKEN TO APPS SCRIPT
  // -----------------------------------------

  function validateToken(token) {

    showStatus(
      "Checking QR...",
      "info"
    );


    const script =
      document.createElement("script");


    const url =
      APPS_SCRIPT_URL +
      "?action=validateQR" +
      "&token=" +
      encodeURIComponent(token) +
      "&callback=qrValidationCallback";


    script.src = url;


    script.onerror = function() {

      showStatus(
        "Unable to connect to MESS server.",
        "error"
      );

      script.remove();

    };


    document.body.appendChild(script);


    setTimeout(function() {

      script.remove();

    }, 10000);

  }


  // -----------------------------------------
  // QR SUCCESS
  // -----------------------------------------

  function onScanSuccess(decodedText, decodedResult) {

    if (!decodedText) {
      return;
    }


    if (decodedText === lastScannedToken) {
      return;
    }


    lastScannedToken =
      decodedText;


    stopScanner();


    validateToken(decodedText);

  }


  // -----------------------------------------
  // QR FAILURE
  // -----------------------------------------

  function onScanFailure(error) {

    // Normal scanning failures ignored.

  }


  // -----------------------------------------
  // START SCANNER
  // -----------------------------------------

  function startScanner() {

    clearResult();

    lastScannedToken = "";


    if (scannerRunning) {
      return;
    }


    scanner =
      new Html5Qrcode("reader");


    const config = {

      fps: 10,

      qrbox: function(viewfinderWidth,
                      viewfinderHeight) {

        const minEdge =
          Math.min(
            viewfinderWidth,
            viewfinderHeight
          );

        const size =
          Math.floor(minEdge * 0.70);


        return {

          width: size,

          height: size

        };

      },

      aspectRatio: 1.0

    };


    scanner.start(

      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    )

    .then(function() {

      scannerRunning = true;

    })

    .catch(function(error) {

      scannerRunning = false;

      console.error(
        "Camera start error:",
        error
      );

      showStatus(
        "Unable to open camera. Please check camera permission and try again.",
        "error"
      );

    });

  }


  // -----------------------------------------
  // STOP SCANNER
  // -----------------------------------------

  function stopScanner() {

    if (!scanner || !scannerRunning) {
      return;
    }


    scanner.stop()

      .then(function() {

        scannerRunning = false;

      })

      .catch(function(error) {

        scannerRunning = false;

      });

  }


  // -----------------------------------------
  // SCAN NEXT QR
  // -----------------------------------------

  function restartScanner() {

    stopScanner();

    clearResult();

    lastScannedToken = "";


    setTimeout(function() {

      startScanner();

    }, 500);

  }


  // -----------------------------------------
  // START
  // -----------------------------------------

  window.onload = function() {

    startScanner();

  };

</script>

</body>

</html>
